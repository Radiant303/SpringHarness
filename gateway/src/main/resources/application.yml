server:
  port: 8080

spring:
  application:
    name: springharness-gateway
  web:
    resources:
      # 网关托管前端静态文件（相对 gateway 模块的工作目录）
      static-locations: file:../frontend/
      cache:
        cachecontrol:
          max-age: 0
  datasource:
    # 宿主 3307 → Docker 容器内 MySQL；serverTimezone=UTC 与库中 naive UTC 时间戳对齐
    # characterEncoding 要填 Java 字符集名 UTF-8，不是 MySQL 的 utf8mb4
    url: jdbc:mysql://127.0.0.1:3307/springharness?characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: root   # 开发环境本地值；生产用环境变量覆盖
  data:
    redis:
      # 宿主 6380 → Docker 容器内 Redis 7（避开 Windows 本地 Redis 占用的 6379）
      host: 127.0.0.1
      port: 6380
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    # 发布确认：TurnDispatchService 逐条同步等确认；confirm/returns 回调记日志
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费失败不重投（消息进 DLQ，由 DlqListener 告警），避免 poison 消息死循环
        default-requeue-rejected: false

app:
  # 必须与 Python 引擎 ~/.springharness/config.toml 的 [cloud].jwt_secret 完全一致
  # 这是"Java 签发、Python 验证"互认 token 的前提；生产用环境变量 JWT_SECRET 覆盖
  # RFC 7518 要求 HS256 密钥 ≥32 字节（jjwt 强制执行），所以开发默认值也要够长
  jwt-secret: ${JWT_SECRET:springharness-dev-secret-0123456789abcd}
  jwt-expire-minutes: 10080
  # /internal/** 内部数据面接口的共享静态令牌：Python 引擎经网关切库时带在 X-Internal-Token 头，
  # 与用户 JWT 无关；生产用环境变量 INTERNAL_TOKEN 覆盖
  internal-token: ${INTERNAL_TOKEN:springharness-internal-dev-token-0123456789}
  # 云端数据根目录：新建会话的工作区路径 = {data-root}/workspaces/{userId}/{sessionId}（只写字符串，不建目录）
  data-root: ${user.home}/.springharness/cloud
  # Python 引擎地址，WS 中继（turn/start 回退透传、token 流）仍然需要
  engine-base-url: ${ENGINE_BASE_URL:http://127.0.0.1:8001}

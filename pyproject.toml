[project]
name = "spring-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.11,<0.12",
    "cjkwrap>=2.2",
    "loguru>=0.7.3",
    "prompt-toolkit>=3.0.53",
    "pydantic-ai>=2.30.0",
    "pydantic-ai-harness[skills]>=0.24.0",
    "pydantic-ai-slim[web]>=2.33.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "tomli>=2.4.1",
    "uvicorn[standard]>=0.52.3",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spring_harness"]

[project.scripts]
springacp = "spring_harness.entrypoints.acp:main"
springcli = "spring_harness.entrypoints.cli:main"
springweb = "spring_harness.entrypoints.web:main"

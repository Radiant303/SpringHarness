services:
  mysql:
    image: mysql:8.0
    container_name: springharness-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: springharness
    ports:
      # 宿主 3307 → 容器 3306（避开 Windows 本地 MySQL 占用的 3306）
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance-schema=OFF
      --innodb-buffer-pool-size=64M
      --innodb-log-buffer-size=8M
      --innodb-redo-log-capacity=32M
      --max-connections=50
      --table-open-cache=200
      --thread-cache-size=10
      --sort-buffer-size=256K
      --join-buffer-size=256K
      --read-buffer-size=256K
      --read-rnd-buffer-size=256K

  # 阶段③启用：雪花 ID worker 分配；阶段④再用作缓存/会话锁/流式推送
  redis:
    image: redis:7
    container_name: springharness-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # 后续阶段启用：后台任务队列（云端 turn 的异步执行）
  # rabbitmq:
  #   image: rabbitmq:3-management
  #   container_name: springharness-rabbitmq
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   volumes:
  #     - rabbitmq-data:/var/lib/rabbitmq

volumes:
  mysql-data:
  redis-data:

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - Spring Harness</title>
  <link rel="stylesheet" href="/static/index.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <div id="admin-app">
    <header id="admin-header">
      <a id="back-link" href="/static/index.html" title="返回对话">←</a>
      <h1>管理后台</h1>
      <span class="spacer"></span>
      <span id="admin-who"></span>
    </header>

    <main id="admin-main">
      <div id="admin-error" class="hidden"></div>

      <section class="admin-section">
        <h2>用户管理</h2>
        <table class="admin-table" id="user-table">
          <thead>
            <tr><th>用户名</th><th>角色</th><th>状态</th><th>存储配额</th><th>work 上限</th><th>注册时间</th><th>操作</th></tr>
          </thead>
          <tbody id="user-tbody"></tbody>
        </table>
      </section>

      <section class="admin-section">
        <h2>用量统计</h2>
        <div class="usage-filter">
          <select id="usage-user"><option value="">全部用户</option></select>
          <input type="date" id="usage-from" title="起始日期（含）">
          <span class="usage-sep">—</span>
          <input type="date" id="usage-to" title="截止日期（不含）">
          <button id="usage-query" class="admin-btn">查询</button>
        </div>
        <table class="admin-table" id="usage-table">
          <thead>
            <tr><th>用户</th><th>模型</th><th>轮次</th><th>请求数</th><th>总输入</th><th>缓存命中</th><th>缓存写入</th><th>输出</th></tr>
          </thead>
          <tbody id="usage-tbody"></tbody>
        </table>
      </section>

      <section class="admin-section hidden" id="settings-section">
        <h2>系统设置</h2>
        <label class="settings-row">
          <input type="checkbox" id="registration-open">
          开放注册（关闭后新用户无法自行注册）
        </label>
        <label class="settings-row">
          单工作区上限（MB）：
          <input type="number" id="work-max-mb" min="1" step="1" class="settings-number">
          <span class="settings-hint">单个项目目录允许占用的最大空间，用户可被单独覆盖</span>
        </label>
        <button id="settings-save" class="admin-btn">保存</button>
        <span id="settings-tip" class="settings-tip"></span>
      </section>
    </main>
  </div>
  <script src="/static/admin.js"></script>
</body>
</html>

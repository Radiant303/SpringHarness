<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring Harness</title>
  <link rel="stylesheet" href="/static/index.css">
  <link rel="stylesheet" href="/static/sprout.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-top">
        <button id="new-session-btn" class="new-session-btn">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M 12 2.1 C 6.532 2.1 2.1 6.532 2.1 12 C 2.1 13.923 2.649 15.719 3.598 17.239 L 2.517 19.821 C 2.104 20.809 2.829 21.9 3.901 21.9 L 12 21.9 C 17.468 21.9 21.9 17.468 21.9 12 C 21.9 6.532 17.468 2.1 12 2.1 Z M 3.9 12 C 3.9 7.526 7.526 3.9 12 3.9 C 16.473 3.9 20.1 7.526 20.1 12 C 20.1 16.473 16.473 20.1 11.999 20.1 L 4.352 20.1 L 5.635 17.035 C 5.635 17.035 5.352 16.629 5.352 16.629 C 4.437 15.317 3.9 13.723 3.9 12 Z" fill="currentColor" fill-opacity="0.902" fill-rule="evenodd"/><g class="nb-plus"><path d="M 12 7.5 L 12 16.5 M 7.5 12 L 16.5 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g></svg></span>
          新建会话 <span class="kbd">Ctrl K</span>
        </button>
      </div>
      <div id="work-list">
        <div class="work-list-header">
          <span>项目</span>
          <button id="new-work-btn" class="icon-btn" title="新建项目">＋</button>
        </div>
        <div id="works"></div>
      </div>
      <div id="session-list"></div>
      <div class="sidebar-footer">
        <div id="user-chip" class="user-chip hidden">
          <img class="user-avatar" src="/static/assets/images/user_image.png" alt="头像">
          <span id="user-name"></span>
          <span class="user-badge" id="user-badge"></span>
          <a id="admin-link" class="hidden" href="/static/admin.html" title="管理后台">管理</a>
          <button id="logout-btn" class="icon-btn" title="退出登录"><svg viewBox="0 0 1024 1024"><path d="M880.47 484.864a38.4 38.4 0 0 1 0 54.272l-189.61 189.653a38.4 38.4 0 1 1-54.315-54.314l124.075-124.075H398.208a38.4 38.4 0 0 1 0-76.8h362.41L636.587 349.525a38.4 38.4 0 0 1 54.314-54.314l189.61 189.653zM436.608 170.667a38.4 38.4 0 0 1-38.4 38.4H246.528a37.461 37.461 0 0 0-37.461 37.461v530.944a37.461 37.461 0 0 0 37.461 37.461h151.68a38.4 38.4 0 1 1 0 76.8H246.528A114.261 114.261 0 0 1 132.267 777.472V246.528A114.261 114.261 0 0 1 246.528 132.267h151.68a38.4 38.4 0 0 1 38.4 38.4z" fill="currentColor"/></svg></button>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="toggle-sidebar" class="icon-btn" title="侧栏">☰</button>
        <span id="breadcrumb"><span id="ws-name"></span><span class="crumb-sep">/</span><span id="session-title"></span></span>
        <span class="spacer"></span>
        <span id="conn-status" class="conn-dot disconnected" title="未连接"></span>
      </header>

      <div id="messages">
        <div id="welcome" class="welcome">
          <h2>Spring Harness</h2>
          <p>输入消息开始对话。</p>
        </div>
      </div>

      <button id="scroll-bottom" class="hidden">↓ 最新消息</button>

      <footer id="input-area">
        <div id="plan-dock" class="hidden">
          <div id="plan-panel" class="hidden">
            <div id="plan-header" title="收起">
              <svg class="plan-head-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.1 6C4.1 5.5 4.5 5.1 5 5.1H19C19.5 5.1 19.9 5.5 19.9 6C19.9 6.5 19.5 6.9 19 6.9H5C4.5 6.9 4.1 6.5 4.1 6ZM4.1 12C4.1 11.5 4.5 11.1 5 11.1H19C19.5 11.1 19.9 11.5 19.9 12C19.9 12.5 19.5 12.9 19 12.9H5C4.5 12.9 4.1 12.5 4.1 12ZM4.1 18C4.1 17.5 4.5 17.1 5 17.1H19C19.5 17.1 19.9 17.5 19.9 18C19.9 18.5 19.5 18.9 19 18.9H5C4.5 18.9 4.1 18.5 4.1 18Z" fill="currentColor"/></svg>
              <span class="plan-title">当前进度</span>
              <span id="plan-progress"></span>
              <span class="spacer"></span>
              <span class="plan-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
            </div>
            <ul id="plan-items"></ul>
          </div>
          <button id="plan-pill" type="button" aria-pressed="false" title="展开/收起">
            <svg class="plan-head-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.1 6C4.1 5.5 4.5 5.1 5 5.1H19C19.5 5.1 19.9 5.5 19.9 6C19.9 6.5 19.5 6.9 19 6.9H5C4.5 6.9 4.1 6.5 4.1 6ZM4.1 12C4.1 11.5 4.5 11.1 5 11.1H19C19.5 11.1 19.9 11.5 19.9 12C19.9 12.5 19.5 12.9 19 12.9H5C4.5 12.9 4.1 12.5 4.1 12ZM4.1 18C4.1 17.5 4.5 17.1 5 17.1H19C19.5 17.1 19.9 17.5 19.9 18C19.9 18.5 19.5 18.9 19 18.9H5C4.5 18.9 4.1 18.5 4.1 18Z" fill="currentColor"/></svg>
            <span>当前进度</span>
            <span id="plan-pill-count"></span>
          </button>
        </div>

        <div id="input-card">
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行，Esc 中断运行"></textarea>
          <div id="input-toolbar">
            <span id="input-ws" class="ws-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span id="input-ws-name"></span>
            </span>
            <span class="spacer"></span>
            <span id="usage">
              <svg id="usage-ring" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="ring-track" cx="12" cy="12" r="9"/>
                <circle id="usage-ring-prog" class="ring-prog" cx="12" cy="12" r="9"/>
              </svg>
              <span id="usage-tip" role="tooltip">上下文用量</span>
            </span>
            <div id="model-pill">
              <button id="model-btn" type="button" title="模型">
                <span id="model-name"></span>
                <span class="model-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
              </button>
              <div id="model-menu" class="hidden"></div>
            </div>
            <button id="send-btn" class="round-btn" title="发送" aria-label="发送">
              <svg viewBox="0 0 1024 1024"><path d="M705.536 433.664a38.4 38.4 0 1 1-54.272 54.272L550.4 387.114667V729.6a38.4 38.4 0 0 1-76.8 0V387.114667l-100.864 100.821333a38.4 38.4 0 1 1-54.272-54.272l166.4-166.4a38.4 38.4 0 0 1 54.272 0l166.4 166.4z" fill="currentColor"/></svg>
            </button>
            <button id="stop-btn" class="round-btn hidden" title="停止" aria-label="停止">
              <svg viewBox="0 0 1024 1024"><path d="M331.946667 379.904c-11.946667 23.466667-11.946667 54.186667-11.946667 115.626667v32.938666c0 61.44 0 92.16 11.946667 115.626667 10.538667 20.650667 27.306667 37.418667 47.957333 47.957333 23.466667 11.946667 54.186667 11.946667 115.626667 11.946667h32.938666c61.44 0 92.16 0 115.626667-11.946667 20.650667-10.538667 37.418667-27.306667 47.957333-47.957333 11.946667-23.466667 11.946667-54.186667 11.946667-115.626667v-32.938666c0-61.44 0-92.16-11.946667-115.626667a109.696 109.696 0 0 0-47.957333-47.957333c-23.466667-11.946667-54.186667-11.946667-115.626667-11.946667h-32.938666c-61.44 0-92.16 0-115.626667 11.946667-20.650667 10.538667-37.418667 27.306667-47.957333 47.957333z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>

        <!-- Agent 提问卡：到达时顶替输入卡片的位置，不再全屏遮罩 -->
        <div id="question-card" class="hidden">
          <div id="question-head">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg></span>
            <span id="question-text"></span>
            <span class="spacer"></span>
            <button id="question-close" class="icon-btn" title="放弃 (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
          <div id="question-options"></div>
          <div id="question-custom-row" class="hidden">
            <span class="q-opt-label">其他</span>
            <input id="question-custom" type="text" placeholder="说说你的想法…">
            <span class="q-num" id="question-custom-num"></span>
          </div>
          <div id="question-actions" class="hidden">
            <button id="question-cancel">放弃 <span class="q-kbd">Esc</span></button>
            <button id="question-submit" class="btn-primary">提交 <span class="q-kbd">Enter</span></button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <div id="approval-modal" class="modal hidden">
    <div class="modal-box">
      <h3>工具审批</h3>
      <div class="modal-row"><span class="modal-label">工具</span><span id="approval-tool"></span></div>
      <pre id="approval-args" class="modal-pre"></pre>
      <pre id="approval-diff" class="modal-pre diff hidden"></pre>
      <div class="modal-actions">
        <button id="approval-reject" class="btn-danger">拒绝</button>
        <button id="approval-approve" class="btn-primary">批准</button>
      </div>
    </div>
  </div>

  <div id="login-overlay" class="modal hidden">
    <div class="modal-box login-box">
      <h3>登录 Spring Harness</h3>
      <input id="login-username" type="text" placeholder="用户名" autocomplete="username">
      <input id="login-password" type="password" placeholder="密码" autocomplete="current-password">
      <div id="login-error" class="login-error"></div>
      <div class="modal-actions">
        <button id="login-register">注册新账号</button>
        <button id="login-submit" class="btn-primary">登录</button>
      </div>
    </div>
  </div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/sprout.js"></script>
  <script src="/static/index.js"></script>
</body>
</html>
